models:
  - type: main
    engine: openai
    model: gpt-4.1

# When no rail fires, the main model is called with this instruction.
# We return a sentinel so we know the message passed all checks cleanly —
# the real answer comes from the LangChain agent, not NeMo.
instructions:
  - type: general
    content: |
      You are a safety classifier for a medical AI chatbot.
      If the user message passes all safety checks, respond with exactly: __INPUT_SAFE__
      Do not answer medical questions yourself.

rails:
  input:
    flows:
      - detect jailbreak
      - detect off topic
      - detect medical emergency
